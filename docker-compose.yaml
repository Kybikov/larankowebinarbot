services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:0.22.25
    command: ["--http=0.0.0.0:8090"]
    restart: unless-stopped
    environment:
      PB_ADMIN_EMAIL: "${POCKETBASE_ADMIN_EMAIL}"
      PB_ADMIN_PASSWORD: "${POCKETBASE_ADMIN_PASSWORD}"
    ports:
      - "${POCKETBASE_PORT:-8090}:8090"
    volumes:
      - pocketbase_data:/pb_data

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      - pocketbase
    environment:
      BOT_TOKEN: "${BOT_TOKEN}"
      ADMIN_IDS: "${ADMIN_IDS:-747629442,1679569357,6134753503}"
      POCKETBASE_URL: "http://pocketbase:8090"
      POCKETBASE_ADMIN_EMAIL: "${POCKETBASE_ADMIN_EMAIL}"
      POCKETBASE_ADMIN_PASSWORD: "${POCKETBASE_ADMIN_PASSWORD}"
      TIMEZONE: "${TIMEZONE:-Europe/Kyiv}"
      DEFAULT_ZOOM_URL: "${DEFAULT_ZOOM_URL}"
      DEFAULT_COURSE_URL: "${DEFAULT_COURSE_URL:-https://course-laranko.kwiga.com/courses/dizain-bez-khaosu}"
      INSTAGRAM_OLA_URL: "${INSTAGRAM_OLA_URL:-https://www.instagram.com/oolachka}"
      INSTAGRAM_SCHOOL_URL: "${INSTAGRAM_SCHOOL_URL:-https://www.instagram.com/laranko_study}"
      INSTAGRAM_STUDIO_URL: "${INSTAGRAM_STUDIO_URL:-https://www.instagram.com/laranko_interior}"
      CURATOR_USERNAME: "${CURATOR_USERNAME:-Laranko_Academy}"

volumes:
  pocketbase_data:
