services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:0.22.25
    command: ["--http=0.0.0.0:8090"]
    restart: unless-stopped
    environment:
      PB_ADMIN_EMAIL: "${POCKETBASE_ADMIN_EMAIL}"
      PB_ADMIN_PASSWORD: "${POCKETBASE_ADMIN_PASSWORD}"
    ports:
      - "${POCKETBASE_PORT:-8090}:8090"
    volumes:
      - pocketbase_data:/pb_data

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      - pocketbase
    environment:
      BOT_TOKEN: "${BOT_TOKEN}"
      ADMIN_IDS: "${ADMIN_IDS:-747629442,1679569357,6134753503}"
      POCKETBASE_URL: "http://pocketbase:8090"
      POCKETBASE_ADMIN_EMAIL: "${POCKETBASE_ADMIN_EMAIL}"
      POCKETBASE_ADMIN_PASSWORD: "${POCKETBASE_ADMIN_PASSWORD}"
      TIMEZONE: "${TIMEZONE:-Europe/Kyiv}"
      DEFAULT_ZOOM_URL: "${DEFAULT_ZOOM_URL}"
      DEFAULT_COURSE_URL: "${DEFAULT_COURSE_URL:-https://course-laranko.kwiga.com/courses/dizain-bez-khaosu}"
      INSTAGRAM_OLA_URL: "${INSTAGRAM_OLA_URL:-https://www.instagram.com/oolachka}"
      INSTAGRAM_SCHOOL_URL: "${INSTAGRAM_SCHOOL_URL:-https://www.instagram.com/laranko_study}"
      INSTAGRAM_STUDIO_URL: "${INSTAGRAM_STUDIO_URL:-https://www.instagram.com/laranko_interior}"
      CURATOR_USERNAME: "${CURATOR_USERNAME:-Laranko_Academy}"
      BOT_USERNAME: "${BOT_USERNAME:-larankowebirnar_bot}"
      ATTRIBUTION_HOST: "0.0.0.0"
      ATTRIBUTION_PORT: "${ATTRIBUTION_PORT:-8080}"
      ATTRIBUTION_PUBLIC_BASE_URL: "${ATTRIBUTION_PUBLIC_BASE_URL:-https://laranko.wtmelon.store}"
      META_PIXEL_ID: "${META_PIXEL_ID}"
      META_ACCESS_TOKEN: "${META_ACCESS_TOKEN}"
      META_ACTION_SOURCE: "${META_ACTION_SOURCE:-website}"
    expose:
      - "${ATTRIBUTION_PORT:-8080}"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.laranko-attribution-http.entryPoints=http"
      - "traefik.http.routers.laranko-attribution-http.rule=Host(`laranko.wtmelon.store`) && PathPrefix(`/tg/start`)"
      - "traefik.http.routers.laranko-attribution-http.middlewares=redirect-to-https"
      - "traefik.http.routers.laranko-attribution-http.priority=100"
      - "traefik.http.routers.laranko-attribution-http.service=laranko-attribution"
      - "traefik.http.routers.laranko-attribution-https.entryPoints=https"
      - "traefik.http.routers.laranko-attribution-https.rule=Host(`laranko.wtmelon.store`) && PathPrefix(`/tg/start`)"
      - "traefik.http.routers.laranko-attribution-https.middlewares=gzip"
      - "traefik.http.routers.laranko-attribution-https.priority=100"
      - "traefik.http.routers.laranko-attribution-https.tls=true"
      - "traefik.http.routers.laranko-attribution-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.laranko-attribution-https.service=laranko-attribution"
      - "traefik.http.services.laranko-attribution.loadbalancer.server.port=8080"
    networks:
      - default
      - coolify

volumes:
  pocketbase_data:

networks:
  coolify:
    external: true
